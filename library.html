<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Library Hub</title>
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    
    <style>
        :root {
            --primary: #2C3E50;
            --sidebar-bg: #FFFFFF;
            --text-main: #333333;
            --text-light: #7F8C8D;
            --accent: #3498DB;
            --panel-bg: rgba(255, 255, 255, 0.95);
            
            /* Room Themes */
            --bg-start: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            --bg-brandis: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            --bg-grossposna: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --bg-borsdorf: linear-gradient(135deg, #e6e9f0 0%, #eef1f5 100%);
            --bg-naunhof: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            
            --current-bg: var(--bg-start);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #f4f4f4;
            color: var(--text-main);
        }

        /* --- 2D QUICK NAVIGATION --- */
        #sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            box-shadow: 2px 0 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .brand-logo {
            padding: 30px 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-section {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .nav-section h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-light);
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 10px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
            font-weight: 500;
            color: var(--text-main);
            text-decoration: none;
        }

        .nav-item:hover, .nav-item.active {
            background: #f0f4f8;
            color: var(--accent);
        }

        /* --- 3D SPATIAL VIEW --- */
        #spatial-container {
            flex: 1;
            position: relative;
            background: var(--current-bg);
            transition: background 0.8s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* Abstract Spatial Floor */
        .floor-grid {
            position: absolute;
            bottom: -20%;
            left: -50%;
            right: -50%;
            height: 80vh;
            background-image: 
                linear-gradient(rgba(255,255,255,0.4) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255,255,255,0.4) 2px, transparent 2px);
            background-size: 60px 60px;
            transform: rotateX(70deg);
            transform-origin: center top;
            pointer-events: none;
            z-index: 1;
        }

        .room-title {
            position: absolute;
            top: 40px;
            left: 50px;
            z-index: 10;
        }

        .room-title h1 {
            font-size: 2.5rem;
            color: var(--primary);
            font-weight: 300;
        }

        .room-title p {
            font-size: 1rem;
            color: var(--text-light);
            margin-top: 5px;
        }

        /* Hotspots Stage */
        #stage {
            display: flex;
            gap: 2rem;
            z-index: 10;
            transform-style: preserve-3d;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
        }

        .hotspot {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            width: 180px;
            height: 200px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid rgba(255,255,255,1);
        }

        .hotspot:hover {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            background: #ffffff;
        }

        .hotspot .material-symbols-outlined {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .hotspot span {
            font-weight: 500;
            font-size: 1.1rem;
            color: var(--primary);
        }

        /* --- PANELS / OVERLAYS --- */
        #overlay-panel {
            position: absolute;
            top: 0;
            right: -500px;
            width: 450px;
            height: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            box-shadow: -5px 0 30px rgba(0,0,0,0.1);
            transition: right 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 200;
            display: flex;
            flex-direction: column;
        }

        #overlay-panel.open {
            right: 0;
        }

        .panel-header {
            padding: 30px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            font-size: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #e74c3c;
        }

        .panel-content {
            padding: 30px;
            overflow-y: auto;
            flex: 1;
        }

        /* Fake Content for Panels */
        .skeleton-block {
            height: 80px;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .skeleton-text {
            height: 20px;
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
            margin-bottom: 10px;
            width: 80%;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

    </style>
</head>
<body>

    <!-- 2D QUICK NAVIGATION -->
    <nav id="sidebar">
        <div class="brand-logo">
            <span class="material-symbols-outlined">account_balance</span>
            Virtual Library
        </div>

        <div class="nav-section">
            <h3>Locations</h3>
            <div class="nav-item active" onclick="switchRoom('start')">
                <span class="material-symbols-outlined">meeting_room</span>
                Start Room
            </div>
            <div class="nav-item" onclick="switchRoom('brandis')">
                <span class="material-symbols-outlined">auto_stories</span>
                Brandis
            </div>
            <div class="nav-item" onclick="switchRoom('grossposna')">
                <span class="material-symbols-outlined">auto_stories</span>
                Großpösna
            </div>
            <div class="nav-item" onclick="switchRoom('borsdorf')">
                <span class="material-symbols-outlined">auto_stories</span>
                Borsdorf
            </div>
            <div class="nav-item" onclick="switchRoom('naunhof')">
                <span class="material-symbols-outlined">auto_stories</span>
                Naunhof
            </div>
        </div>

        <div class="nav-section">
            <h3>Quick Actions</h3>
            <div class="nav-item" onclick="openPanel('Catalog', 'search')">
                <span class="material-symbols-outlined">search</span>
                Catalog
            </div>
            <div class="nav-item" onclick="openPanel('My Account', 'person')">
                <span class="material-symbols-outlined">person</span>
                My Account
            </div>
            <div class="nav-item" onclick="openPanel('Help & Chat', 'chat')">
                <span class="material-symbols-outlined">chat</span>
                Help
            </div>
        </div>
    </nav>

    <!-- 3D SPATIAL VIEW -->
    <main id="spatial-container">
        
        <div class="floor-grid"></div>

        <div class="room-title">
            <h1 id="room-name">Central Start Room</h1>
            <p id="room-desc">Select a library location to begin exploring.</p>
        </div>

        <div id="stage">
            <!-- Dynamic Hotspots will be injected here by JS -->
        </div>

        <!-- OVERLAY PANEL -->
        <aside id="overlay-panel">
            <div class="panel-header">
                <h2 id="panel-title">
                    <span class="material-symbols-outlined" id="panel-icon">search</span>
                    Title
                </h2>
                <button class="close-btn" onclick="closePanel()">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="panel-content" id="panel-body">
                <!-- Content generated via JS -->
            </div>
        </aside>

    </main>

    <script>
        // --- DATA & CONFIGURATION ---
        const rooms = {
            start: {
                title: "Central Start Room",
                desc: "Welcome. Please select a library location.",
                theme: "var(--bg-start)",
                hotspots: [
                    { label: "Enter Brandis", icon: "login", action: "switchRoom('brandis')" },
                    { label: "Enter Großpösna", icon: "login", action: "switchRoom('grossposna')" },
                    { label: "Enter Borsdorf", icon: "login", action: "switchRoom('borsdorf')" },
                    { label: "Enter Naunhof", icon: "login", action: "switchRoom('naunhof')" }
                ]
            },
            library: {
                hotspots: [
                    { label: "Catalog", icon: "search", action: "openPanel('Catalog', 'search')" },
                    { label: "My Account", icon: "person", action: "openPanel('My Account', 'person')" },
                    { label: "Events", icon: "calendar_month", action: "openPanel('Events', 'calendar_month')" },
                    { label: "Community", icon: "groups", action: "openPanel('Community', 'groups')" },
                    { label: "Chat / Help", icon: "chat", action: "openPanel('Chat / Help', 'chat')" },
                    { label: "Exit to Start", icon: "logout", action: "switchRoom('start')" }
                ]
            }
        };

        const locations = {
            brandis: { title: "Library Brandis", desc: "Welcome to the digital branch of Brandis.", theme: "var(--bg-brandis)" },
            grossposna: { title: "Library Großpösna", desc: "Welcome to the digital branch of Großpösna.", theme: "var(--bg-grossposna)" },
            borsdorf: { title: "Library Borsdorf", desc: "Welcome to the digital branch of Borsdorf.", theme: "var(--bg-borsdorf)" },
            naunhof: { title: "Library Naunhof", desc: "Welcome to the digital branch of Naunhof.", theme: "var(--bg-naunhof)" }
        };

        // --- CORE FUNCTIONS ---

        function switchRoom(roomId) {
            closePanel(); // Close overlay if open

            const container = document.getElementById('spatial-container');
            const titleEl = document.getElementById('room-name');
            const descEl = document.getElementById('room-desc');
            const stage = document.getElementById('stage');

            // Update Active state in Sidebar
            document.querySelectorAll('.nav-section:first-child .nav-item').forEach(el => el.classList.remove('active'));
            event?.currentTarget?.classList.add('active');

            if (roomId === 'start') {
                container.style.setProperty('--current-bg', rooms.start.theme);
                titleEl.innerText = rooms.start.title;
                descEl.innerText = rooms.start.desc;
                renderHotspots(rooms.start.hotspots);
            } else {
                container.style.setProperty('--current-bg', locations[roomId].theme);
                titleEl.innerText = locations[roomId].title;
                descEl.innerText = locations[roomId].desc;
                renderHotspots(rooms.library.hotspots);
            }
        }

        function renderHotspots(hotspotsData) {
            const stage = document.getElementById('stage');
            stage.innerHTML = ''; // Clear current
            
            hotspotsData.forEach((spot, index) => {
                const div = document.createElement('div');
                div.className = 'hotspot';
                div.setAttribute('onclick', spot.action);
                // Staggered animation effect
                div.style.animation = `fadeInUp 0.5s ease forwards ${index * 0.1}s`;
                div.style.opacity = '0';
                div.style.transform = 'translateY(20px)';
                
                div.innerHTML = `
                    <span class="material-symbols-outlined">${spot.icon}</span>
                    <span>${spot.label}</span>
                `;
                stage.appendChild(div);
            });
        }

        // --- OVERLAY PANEL FUNCTIONS ---
        function openPanel(title, icon) {
            const panel = document.getElementById('overlay-panel');
            document.getElementById('panel-title').innerHTML = `<span class="material-symbols-outlined">${icon}</span> ${title}`;
            
            const body = document.getElementById('panel-body');
            
            // Generate contextual dummy content
            if (title === 'Catalog') {
                body.innerHTML = `
                    <p style="margin-bottom: 20px; color: var(--text-light)">Search books, media, and digital assets.</p>
                    <input type="text" placeholder="Search..." style="width:100%; padding:15px; border-radius:8px; border:1px solid #ccc; margin-bottom: 20px; font-size:1rem;">
                    <div class="skeleton-block"></div>
                    <div class="skeleton-block"></div>
                    <div class="skeleton-block"></div>
                `;
            } else if (title === 'My Account') {
                body.innerHTML = `
                    <div style="text-align: center; margin-bottom: 30px;">
                        <span class="material-symbols-outlined" style="font-size: 4rem; color: var(--accent)">account_circle</span>
                        <h3 style="margin-top: 10px;">Max Mustermann</h3>
                        <p style="color: var(--text-light)">Library Card #12345678</p>
                    </div>
                    <h4 style="margin-bottom: 10px;">Currently Borrowed</h4>
                    <div class="skeleton-block"></div>
                    <div class="skeleton-block"></div>
                `;
            } else {
                body.innerHTML = `
                    <p style="margin-bottom: 20px; color: var(--text-light)">Information and interactions for ${title}.</p>
                    <div class="skeleton-text" style="width:100%"></div>
                    <div class="skeleton-text" style="width:90%"></div>
                    <div class="skeleton-text" style="width:95%"></div>
                    <div class="skeleton-text" style="width:70%"></div>
                    <button class="btn-primary">Load More</button>
                `;
            }

            panel.classList.add('open');
        }

        function closePanel() {
            document.getElementById('overlay-panel').classList.remove('open');
        }

        // Add CSS keyframes dynamically for hotspot load animation
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes fadeInUp {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        `;
        document.head.appendChild(styleSheet);

        // Initialize Start Room on Load
        window.onload = () => {
            renderHotspots(rooms.start.hotspots);
            
            // Ensure first nav item is visually active initially
            document.querySelector('.nav-item').classList.add('active');
        };

    </script>
</body>
</html>
