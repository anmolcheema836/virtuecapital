<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    img{
        height: 30vh;
        width: auto;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 10px;
        background-color: #cff952;
    }
    .cartitem{
        display: flex;
        flex-direction: row;
        gap: 50px;
        align-items: center;
        justify-content: center;
        border: 1px solid black;
        padding: 10px;
        margin: 10px;
    }
    .subitem{
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    h2{
        font-size: large;
    }
    p{
        font-size: x-large;
        color: green;
    }
    .outerdiv{
        display: flex;
        flex-direction: column;
        gap: 10vh;
        align-items: center;
        justify-content: center;
    }
    @media (max-width: 600px) {
        .cartitem {
            flex-direction: column;
            gap: 20px;
        }
    }
    </style>
</head>
<body>
    <h1>Cart</h1>
    <h2>Items in you cart</h2>
    <div class="outerdiv">
    <div class="cartitem">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJVjdfNf40AwaxAmTg4VoYuDFyxDxo_qXLVg&s" alt="cart" width="100px">
    <div class="subitem">
    <h3>Headphones</h3>
    <p>Price: $50</p>
    </div>
    </div>
</div> 
    <button>Checkout</button>
</body>
</html>
