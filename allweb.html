<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started - All Webbed Up</title>
    <meta name="description" content="Digital Marketing Strategy Call. Enter your details or call us now.">

    <!-- Fonts: Poppins (Brand Font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- BRAND VARIABLES --- */
        :root {
            --brand-green: #00C647;
            --brand-green-dark: #00a33b;
            --text-main: #32373c;
            --text-light: #6e6e6e;
            --white: #ffffff;
            --bg-gradient: linear-gradient(180deg, #ffffff 0%, #f4fcf6 100%);
            --shadow-card: 0 20px 40px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 25px 50px rgba(0, 198, 71, 0.15);
            --radius: 16px;
        }

        /* --- RESET --- */
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        /* --- LAYOUT CONTAINER --- */
        .wrapper {
            width: 100%;
            max-width: 520px; /* Narrow focus for high conversion */
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- LOGO --- */
        .logo-container {
            margin-bottom: 30px;
            text-align: center;
        }
        .logo {
            max-width: 220px;
            height: auto;
            transition: opacity 0.3s;
        }
        .logo:hover { opacity: 0.9; }

        /* --- HERO TEXT --- */
        .hero-text {
            text-align: center;
            margin-bottom: 30px;
        }
        .hero-text h1 {
            font-weight: 700;
            font-size: 28px;
            line-height: 1.2;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        .hero-text p {
            color: var(--text-light);
            font-size: 16px;
            font-weight: 400;
        }

        /* --- ELEMENT 1: PROMINENT CALL BUTTON --- */
        .cta-call-container {
            width: 100%;
            margin-bottom: 30px;
            position: relative;
        }

        .btn-call {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background-color: var(--brand-green);
            color: var(--white);
            font-size: 20px;
            font-weight: 700;
            padding: 20px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 198, 71, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-call i { margin-right: 12px; font-size: 22px; }

        .btn-call:hover {
            background-color: var(--brand-green-dark);
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0, 198, 71, 0.5);
        }

        /* Subtle Pulse Animation */
        .btn-call::after {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            border-radius: 50px;
            box-shadow: 0 0 0 0 rgba(0, 198, 71, 0.7);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 198, 71, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(0, 198, 71, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 198, 71, 0); }
        }

        /* --- ELEMENT 2: CLEAN LEAD FORM --- */
        .form-card {
            background: var(--white);
            width: 100%;
            padding: 35px 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            margin-bottom: 25px;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .form-header {
            margin-bottom: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-field {
            width: 100%;
            padding: 16px 16px 16px 45px; /* Space for icon */
            border: 1px solid #e1e1e1;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            color: var(--text-main);
            background: #f9f9f9;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            background: #fff;
            border-color: var(--brand-green);
            box-shadow: 0 0 0 4px rgba(0, 198, 71, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 16px;
            transition: color 0.3s;
        }

        .input-field:focus + .input-icon { color: var(--brand-green); }

        textarea.input-field {
            padding-left: 16px; /* No icon for textarea usually */
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: var(--text-main); /* Black/Dark Grey */
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #000;
        }

        /* Success Message */
        .success-message {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .success-icon {
            font-size: 48px;
            color: var(--brand-green);
            margin-bottom: 15px;
            display: block;
        }

        /* --- ELEMENT 3: GOOGLE REVIEWS BUTTON --- */
        .review-section {
            width: 100%;
            text-align: center;
        }

        .btn-reviews {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--white);
            border: 1px solid #e0e0e0;
            padding: 14px 24px;
            border-radius: 50px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
        }

        .btn-reviews:hover {
            border-color: var(--brand-green);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.05);
        }

        .g-icon {
            color: #4285F4;
            font-size: 18px;
            margin-right: 10px;
        }

        .stars {
            color: #F4B400;
            margin-left: 8px;
            font-size: 13px;
            letter-spacing: 1px;
        }

        /* --- FOOTER --- */
        footer {
            margin-top: 50px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }

        /* --- RESPONSIVE TWEAKS --- */
        @media (max-width: 480px) {
            .wrapper { padding: 30px 15px; }
            .btn-call { font-size: 18px; }
            .form-card { padding: 25px 20px; }
            .hero-text h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <!-- Logo -->
        <div class="logo-container">
            <a href="https://allwebbedup.com.au">
                <img src="https://allwebbedup.com.au/wp-content/uploads/2024/04/All-Webbed-Up-01-3-2.png" alt="All Webbed Up" class="logo">
            </a>
        </div>

        <!-- Hero -->
        <div class="hero-text">
            <h1>Let's Scale Your Business</h1>
            <p>Speak to a strategist today. No obligations.</p>
        </div>

        <!-- 1. Prominent Click-to-Call -->
        <div class="cta-call-container">
            <a href="tel:1800714148" class="btn-call">
                <i class="fa-solid fa-phone-volume"></i> CALL 1800 714 148
            </a>
        </div>

        <!-- 2. Clean Lead Capture Form -->
        <div class="form-card">
            
            <div id="form-content">
                <div class="form-header">Or request a call back</div>
                <!-- Using the Formspree ID from your original site. Replace URL if needed. -->
                <form id="leadForm" action="https://formspree.io/f/xnnzazvj" method="POST">
                    
                    <div class="input-group">
                        <input type="text" name="name" class="input-field" placeholder="Full Name" required>
                        <i class="fa-regular fa-user input-icon"></i>
                    </div>

                    <div class="input-group">
                        <input type="tel" name="phone" class="input-field" placeholder="Phone Number" required>
                        <i class="fa-solid fa-phone input-icon"></i>
                    </div>

                    <div class="input-group">
                        <input type="email" name="email" class="input-field" placeholder="Email Address" required>
                        <i class="fa-regular fa-envelope input-icon"></i>
                    </div>

                    <div class="input-group">
                        <textarea name="message" class="input-field" placeholder="How can we help?" rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Claim My Strategy Call</button>
                </form>
            </div>

            <!-- Hidden Success Message -->
            <div id="success-msg" class="success-message">
                <i class="fa-regular fa-circle-check success-icon"></i>
                <h3 style="margin-bottom: 10px;">We'll be in touch!</h3>
                <p style="color:#666; font-size: 14px;">One of our strategists will contact you within 24 hours.</p>
            </div>

        </div>

        <!-- 3. Reviews Button -->
        <div class="review-section">
            <a href="https://maps.app.goo.gl/TZqDHUUBtWPLj9rJA" target="_blank" class="btn-reviews">
                <i class="fa-brands fa-google g-icon"></i>
                Check our 100+ reviews
                <div class="stars">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                </div>
            </a>
        </div>

        <footer>
            &copy; <script>document.write(new Date().getFullYear())</script> All Webbed Up. All Rights Reserved.
        </footer>

    </div>

    <!-- Script for Form Handling (No Page Reload) -->
    <script>
        const form = document.getElementById("leadForm");
        const formContent = document.getElementById("form-content");
        const successMsg = document.getElementById("success-msg");

        async function handleSubmit(event) {
            event.preventDefault();
            const data = new FormData(event.target);
            const btn = document.querySelector('.btn-submit');
            const originalText = btn.innerText;

            // Loading state
            btn.innerText = "Sending...";
            btn.style.opacity = "0.7";

            try {
                const response = await fetch(event.target.action, {
                    method: form.method,
                    body: data,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    // Show Success
                    formContent.style.display = "none";
                    successMsg.style.display = "block";
                } else {
                    // Show Error
                    alert("Oops! There was a problem submitting your form. Please call us directly.");
                    btn.innerText = originalText;
                    btn.style.opacity = "1";
                }
            } catch (error) {
                alert("Oops! There was a problem submitting your form. Please call us directly.");
                btn.innerText = originalText;
                btn.style.opacity = "1";
            }
        }

        form.addEventListener("submit", handleSubmit);
    </script>

</body>
</html>
