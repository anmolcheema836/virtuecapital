<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Niseko Chiropractic Massage & Mobile Treatments</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --desktop-height: 250px;
      --mobile-height: 180px;
      --overlay: rgba(0, 0, 0, 0.4);
      --text: #ffffff;
      --radius: 12px;
    }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 30px 15px;
    }

    .niseko-banners {
      display: grid;
      gap: 18px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .niseko-banner {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease;
    }

    .niseko-banner:hover {
      transform: scale(1.02);
    }

    .niseko-banner a {
      display: block;
      height: var(--desktop-height);
      text-decoration: none;
      color: inherit;
      position: relative;
    }

    .niseko-banner picture,
    .niseko-banner img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: brightness(0.85);
    }

    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.15), var(--overlay));
    }

    .banner-text {
      position: absolute;
      bottom: 16px;
      left: 24px;
      right: 24px;
      color: var(--text);
      z-index: 2;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .banner-label {
      font-size: 22px;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .niseko-banner a {
        height: var(--mobile-height);
      }
      .banner-label {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="niseko-banners">

    <!-- 1. 60 Minute Massage -->
    <div class="niseko-banner">
      <a href="#" title="60 Minute Niseko Mobile Massage">
        <picture>
          <img src="https://www.freelancer.com/fs/download-api.php?type=contest&id=2648710&filename=1.%2060%20minute%20massage.jpg" alt="60 Minute Niseko Mobile Massage">
        </picture>
        <div class="banner-overlay"></div>
        <div class="banner-text">
          <div class="banner-label">60 Minute Niseko Mobile Massage</div>
        </div>
      </a>
    </div>

    <!-- 2. 90 Minute Massage -->
    <div class="niseko-banner">
      <a href="#" title="90 Minute Niseko Mobile Massage">
        <picture>
          <img src="https://www.freelancer.com/fs/download-api.php?type=contest&id=2648710&filename=2.%2090%20minute%20massage.jpg" alt="90 Minute Niseko Mobile Massage">
        </picture>
        <div class="banner-overlay"></div>
        <div class="banner-text">
          <div class="banner-label">90 Minute Niseko Mobile Massage</div>
        </div>
      </a>
    </div>

    <!-- 3. 120 Minute Massage -->
    <div class="niseko-banner">
      <a href="#" title="120 Minute Niseko Mobile Massage">
        <picture>
          <img src="https://www.freelancer.com/fs/download-api.php?type=contest&id=2648710&filename=3.%20120%20minute%20massage.jpg" alt="120 Minute Niseko Mobile Massage">
        </picture>
        <div class="banner-overlay"></div>
        <div class="banner-text">
          <div class="banner-label">120 Minute Niseko Mobile Massage</div>
        </div>
      </a>
    </div>

    <!-- 4. Chiropractic Mobile Visit -->
    <div class="niseko-banner">
      <a href="#" title="Niseko Chiropractic Mobile Visit">
        <picture>
          <img src="https://www.freelancer.com/fs/download-api.php?type=contest&id=2648710&filename=4.Niseko%20mobile%20consultation.jpg" alt="Niseko Chiropractic Mobile Visit">
        </picture>
        <div class="banner-overlay"></div>
        <div class="banner-text">
          <div class="banner-label">Niseko Chiropractic Mobile Visit</div>
        </div>
      </a>
    </div>

    <!-- 5. Extended Session Mobile Treatment -->
    <div class="niseko-banner">
      <a href="#" title="Niseko Extended Session Mobile Treatment">
        <picture>
          <img src="https://www.freelancer.com/fs/download-api.php?type=contest&id=2648710&filename=5.Chiro%20extended%20consultation.jpg" alt="Niseko Extended Session Mobile Treatment">
        </picture>
        <div class="banner-overlay"></div>
        <div class="banner-text">
          <div class="banner-label">Niseko Extended Session Mobile Treatment</div>
        </div>
      </a>
    </div>

  </div>

</body>
</html>
