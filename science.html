<head>

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --light: #ecf0f1;
            --success: #27ae60;
            --danger: #c0392b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 { margin: 0; color: var(--primary); font-size: 1.8rem; }
        p.subtitle { color: #666; margin-top: 5px; }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-submit { background-color: var(--success); color: white; }
        .btn-reset { background-color: var(--danger); color: white; }
        .btn:hover { opacity: 0.9; }

        .question-card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent);
        }

        .q-text { font-weight: 600; font-size: 1.1rem; margin-bottom: 15px; }
        
        .options-grid {
            display: grid;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }

        .option-label:hover { background-color: var(--light); }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }

        /* Results Styling */
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; }
        .incorrect { background-color: #f8d7da !important; border-color: #f5c6cb !important; }
        .feedback { font-size: 0.9rem; margin-top: 10px; font-weight: bold; }

        #result-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
            width: 80%;
            max-width: 400px;
        }
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .category-header {
            background: var(--primary);
            color: white;
            padding: 10px;
            margin-top: 30px;
            border-radius: 5px;
        }
    </style>
</head>

    let userAnswers = {};

    function init() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            userAnswers = JSON.parse(stored);
        }
        renderQuiz();
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';

        let currentCat = '';

        questions.forEach((item, index) => {
            // Category Headers
            if (item.cat !== currentCat) {
                currentCat = item.cat;
                const catHeader = document.createElement('div');
                catHeader.className = 'category-header';
                catHeader.innerHTML = `<h3>${currentCat}</h3>`;
                container.appendChild(catHeader);
            }

            const card = document.createElement('div');
            card.className = 'question-card';
            
            let optionsHtml = '';
            item.o.forEach((opt, optIndex) => {
                const isChecked = userAnswers[index] === optIndex ? 'checked' : '';
                optionsHtml += `
                    <label class="option-label" id="lbl-${index}-${optIndex}">
                        <input type="radio" name="q${index}" value="${optIndex}" 
                            onchange="saveAnswer(${index}, ${optIndex})" ${isChecked}>
                        ${opt}
                    </label>
                `;
            });

            card.innerHTML = `
                <div class="q-text">${index + 1}. ${item.q}</div>
                <div class="options-grid">
                    ${optionsHtml}
                </div>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            container.appendChild(card);
        });
    }

    function saveAnswer(qIndex, optIndex) {
        userAnswers[qIndex] = optIndex;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(userAnswers));
        
        // Remove feedback if changing answer after submit
        const lbls = document.querySelectorAll(`[id^=lbl-${qIndex}-]`);
        lbls.forEach(l => {
            l.classList.remove('correct', 'incorrect');
        });
        document.getElementById(`feedback-${qIndex}`).innerHTML = '';
    }

    function submitQuiz() {
        let score = 0;
        let total = questions.length;
        let attempted = Object.keys(userAnswers).length;

        if (attempted < total) {
            if(!confirm(`You have attempted ${attempted} out of ${total} questions. Do you still want to submit?`)) return;
        }

        questions.forEach((q, index) => {
            const selected = userAnswers[index];
            const feedbackEl = document.getElementById(`feedback-${index}`);
            
            // Visual feedback
            const correctLabel = document.getElementById(`lbl-${index}-${q.a}`);
            if(correctLabel) correctLabel.classList.add('correct');

            if (selected !== undefined) {
                if (selected === q.a) {
                    score++;
                    feedbackEl.innerHTML = '<span style="color:var(--success)">Correct!</span>';
                } else {
                    const selectedLabel = document.getElementById(`lbl-${index}-${selected}`);
                    if(selectedLabel) selectedLabel.classList.add('incorrect');
                    feedbackEl.innerHTML = `<span style="color:var(--danger)">Incorrect. Correct answer: ${q.o[q.a]}</span>`;
                }
            } else {
                feedbackEl.innerHTML = `<span style="color:orange">Not Attempted. Correct answer: ${q.o[q.a]}</span>`;
            }
        });

        // Show Modal
        const modal = document.getElementById('result-modal');
        const overlay = document.getElementById('overlay');
        const scoreDisplay = document.getElementById('score-display');
        const percentDisplay = document.getElementById('percentage-display');

        scoreDisplay.innerText = `${score} / ${total}`;
        const percent = ((score/total)*100).toFixed(1);
        percentDisplay.innerText = `Percentage: ${percent}%`;
        
        modal.style.display = 'block';
        overlay.style.display = 'block';
        
        // Scroll to top
        window.scrollTo(0,0);
    }

    function closeModal() {
        document.getElementById('result-modal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    function resetQuiz() {
        if(confirm("Are you sure? This will clear all your saved answers.")) {
            localStorage.removeItem(STORAGE_KEY);
            userAnswers = {};
            location.reload();
        }
    }

    // Run on load
    init();

</script>

</body>
</html>
