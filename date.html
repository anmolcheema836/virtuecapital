<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Date Detective</title>
    <!-- Importing Fonts: Playfair Display for the 'Noir' look, Lato for readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS STYLES --- */
        :root {
            --bg-dark: #0f0b0b;    /* Nearly black */
            --bg-accent: #2c1212;  /* Deep noir red/brown from the logo background */
            --gold: #d4af37;       /* Metallic gold from the text */
            --gold-dim: #8a7020;
            --text: #f0f0f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-dark);
            /* Radial gradient creates a spotlight effect in the center */
            background-image: radial-gradient(circle at center, var(--bg-accent) 0%, var(--bg-dark) 70%);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        /* Container for the main content to keep it centered and constrained */
        .container {
            width: 90%;
            max-width: 600px;
            padding: 20px;
            animation: fadeIn 2s ease-in-out;
            position: relative;
            z-index: 2;
        }

        /* Logo Styling */
        .logo {
            max-width: 280px; 
            width: 100%;
            height: auto;
            margin-bottom: 2rem;
            /* Drop shadow adds depth */
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: transform 0.8s ease;
        }

        /* Headline Typography */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text);
            letter-spacing: 1px;
            margin-bottom: 3rem;
            line-height: 1.6;
            opacity: 0.9;
        }

        /* The 'CTA' Button */
        .btn {
            background: transparent;
            color: var(--gold);
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            padding: 15px 40px;
            border: 1px solid var(--gold);
            cursor: pointer;
            transition: all 0.4s ease;
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background-color: rgba(212, 175, 55, 0.1); /* Subtle gold tint */
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            letter-spacing: 5px; /* Expands on hover */
        }

        /* Form / Question Area (Hidden initially) */
        .investigation-panel {
            display: none; /* Hidden by default */
            opacity: 0;
            transition: opacity 1s ease;
        }

        .input-group {
            margin-top: 20px;
        }

        .question-label {
            display: block;
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        /* Minimalist Input line */
        input[type="text"] {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            width: 100%;
            padding: 10px;
            font-size: 1.2rem;
            color: white;
            text-align: center;
            font-family: 'Lato', sans-serif;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-bottom-color: var(--gold);
        }

        /* Subtle noise texture overlay for Film Noir vibe */
        .texture-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            z-index: 1;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.2rem; }
            .logo { max-width: 220px; }
        }
    </style>
</head>
<body>

    <!-- Film Grain Overlay -->
    <div class="texture-overlay"></div>

    <div class="container">
        <!-- 
           IMPORTANT: 
           Place your logo file in the same folder as this index.html file.
           Rename your file to 'logo.png' or change the src below.
        -->
        <img src="date.png" alt="The Date Detective Logo" class="logo" id="mainLogo">

        <!-- Initial View -->
        <div id="welcome-screen">
            <h1>The Date Detective will find you the perfect date.</h1>
            <button class="btn" onclick="startInvestigation()">Start Investigation</button>
        </div>

        <!-- Question View (Hidden initially) -->
        <div id="investigation-screen" class="investigation-panel">
            <div class="input-group">
                <label class="question-label" id="q-label">Question 1</label>
                <!-- Placeholder text changes via JS -->
                <input type="text" id="user-input" placeholder="Who is the lucky suspect?" autocomplete="off" onkeypress="handleEnter(event)">
            </div>
        </div>
    </div>

    <script>
        /* --- JAVASCRIPT LOGIC --- */

        function startInvestigation() {
            const welcomeScreen = document.getElementById('welcome-screen');
            const investigationScreen = document.getElementById('investigation-screen');
            const logo = document.getElementById('mainLogo');

            // 1. Fade out welcome text
            welcomeScreen.style.opacity = '0';
            
            // 2. Shrink logo slightly to make room
            logo.style.transform = "scale(0.8)";

            // 3. Wait for fade out, then swap visibility
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                investigationScreen.style.display = 'block';
                
                // Trigger reflow to allow opacity transition
                setTimeout(() => {
                    investigationScreen.style.opacity = '1';
                    document.getElementById('user-input').focus();
                }, 50);
            }, 500);
        }

        // Handle 'Enter' key to simulate moving to next question
        function handleEnter(e) {
            if(e.key === 'Enter'){
                const input = document.getElementById('user-input');
                const label = document.getElementById('q-label');
                
                if(input.value.trim() !== "") {
                    // Simple demo logic to show transition
                    input.style.opacity = '0';
                    label.style.opacity = '0';
                    
                    setTimeout(() => {
                        input.value = "";
                        label.innerText = "Question 2"; // Demo change
                        input.placeholder = "What is the mood of the evening?";
                        input.style.opacity = '1';
                        label.style.opacity = '1';
                        input.focus();
                    }, 500);
                }
            }
        }
    </script>
</body>
</html>
