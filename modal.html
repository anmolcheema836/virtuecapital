<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werde Pro User - Redesign</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        :root {
            --primary-blue: #4A90E2;
            --light-blue-bg: #F0F7FF;
            --dark-text: #2D3748;
            --light-text: #718096;
            --border-color: #E2E8F0;
            --white: #FFFFFF;
            --success-green: #28a745;
            --success-green-bg: #EAF7EC;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f7fafc; /* A neutral bg to showcase the modal */
            margin: 0;
            padding: 20px;
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-container {
            background-color: var(--white);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 800px;
            display: flex;
            overflow: hidden;
            transform: scale(0.95);
            opacity: 0;
            animation: fadeInScale 0.3s forwards ease-out;
        }
        
        @keyframes fadeInScale {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-benefits, .modal-payment {
            padding: 48px;
        }

        /* Left Side: Benefits Section */
        .modal-benefits {
            background-color: var(--light-blue-bg);
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .modal-benefits h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--dark-text);
            margin-top: 0;
            margin-bottom: 16px;
        }

        .modal-benefits p {
            color: var(--light-text);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 15px;
            color: #4A5568;
        }

        .benefit-item svg {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            color: var(--primary-blue);
        }

        /* Right Side: Payment Section */
        .modal-payment {
            width: 55%;
            display: flex;
            flex-direction: column;
        }

        .plan-selector {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .plan-card {
            flex: 1;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .plan-card:hover {
            border-color: var(--primary-blue);
            transform: translateY(-3px);
        }
        
        .plan-card.selected {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }
        
        .plan-card .title {
            font-weight: 600;
            font-size: 16px;
            color: var(--dark-text);
            display: block;
            margin-bottom: 8px;
        }
        
        .plan-card .price {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark-text);
        }

        .plan-card .price .period {
            font-size: 14px;
            font-weight: 400;
            color: var(--light-text);
        }
        
        .best-offer-tag {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--success-green);
            color: var(--white);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 16px;
            white-space: nowrap;
        }
        
        .price-summary {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .price-summary .final-price {
            font-size: 48px;
            font-weight: 700;
            color: var(--dark-text);
            line-height: 1;
        }
        
        .price-summary .final-price .currency {
            font-size: 32px;
            vertical-align: super;
            margin-right: 4px;
        }

        .price-summary .billing-cycle {
            font-size: 16px;
            color: var(--light-text);
        }
        
        .cancellation-policy {
            text-align: center;
            color: var(--light-text);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .cta-button {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            background: var(--primary-blue);
            color: var(--white);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .modal-container {
                flex-direction: column;
                max-width: 380px;
                margin: 20px;
            }
            .modal-benefits, .modal-payment {
                width: auto;
                padding: 32px;
            }
            .modal-benefits {
                text-align: center;
            }
            .benefit-item {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="modal-backdrop">
        <div class="modal-container">
            <!-- Left Side: Benefits -->
            <div class="modal-benefits">
                <h2>Werde Pro User</h2>
                <p>Erschliesse dir exklusive Vorteile und finde schneller deine Traumwohnung.</p>
                <div class="benefit-list">
                    <div class="benefit-item">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941" /></svg>
                        <span>Voller Zugriff auf alle Inserate</span>
                    </div>
                    <div class="benefit-item">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" /></svg>
                        <span>Sofortige Benachrichtigungen</span>
                    </div>
                     <div class="benefit-item">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" /></svg>
                        <span>Erhöhte Chancen als Erstbewerber</span>
                    </div>
                </div>
            </div>
            <!-- Right Side: Payment -->
            <div class="modal-payment">
                <div class="plan-selector">
                    <div class="plan-card" id="monthly-plan" onclick="selectPlan('monthly')">
                        <span class="title">Monatlich</span>
                        <span class="price">CHF 12<span class="period">/Monat</span></span>
                    </div>
                    <div class="plan-card selected" id="yearly-plan" onclick="selectPlan('yearly')">
                        <div class="best-offer-tag"> spare CHF 20</div>
                        <span class="title">Jährlich</span>
                        <span class="price">CHF 99<span class="period">/Jahr</span></span>
                    </div>
                </div>

                <div class="price-summary">
                    <div class="final-price" id="final-price-display"><span class="currency">CHF</span>99.00</div>
                    <div class="billing-cycle" id="billing-cycle-display">pro Jahr</div>
                </div>

                <p class="cancellation-policy">jederzeit kündbar</p>

                <button class="cta-button">Jetzt Kaufen</button>
            </div>
        </div>
    </div>

    <script>
        function selectPlan(plan) {
            const monthlyPlan = document.getElementById('monthly-plan');
            const yearlyPlan = document.getElementById('yearly-plan');
            const finalPriceDisplay = document.getElementById('final-price-display');
            const billingCycleDisplay = document.getElementById('billing-cycle-display');
            
            if (plan === 'monthly') {
                monthlyPlan.classList.add('selected');
                yearlyPlan.classList.remove('selected');
                finalPriceDisplay.innerHTML = '<span class="currency">CHF</span>12.00';
                billingCycleDisplay.textContent = 'pro Monat';
            } else {
                yearlyPlan.classList.add('selected');
                monthlyPlan.classList.remove('selected');
                finalPriceDisplay.innerHTML = '<span class="currency">CHF</span>99.00';
                billingCycleDisplay.textContent = 'pro Jahr';
            }
        }

        // Initialize with the yearly plan selected
        document.addEventListener('DOMContentLoaded', () => selectPlan('yearly'));
    </script>

</body>
</html>
