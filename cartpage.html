<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart page</title>
    <style>
   * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        display: flex;
        flex-direction: column;
        align-items: left;
        justify-content: left;
        padding: 20px;
        background-color: #f5f5f5;
    }
    .outerdiv {
        display: flex;
        flex-direction: row;
        gap: 50px;
        align-items: flex-start;
        justify-content: flex-start;
        margin-top: 50px;
        border: 1px solid black;
        border-radius: 20px;
    }
    .leftdiv{
        flex:1;
        min-width: 0;
    }
    .cartitem{
        display: flex;
        align-items: start;
        justify-content: start;
        padding: 20px;
        gap:20px;
        margin:20px;
        border: 1px solid black;
        border-radius: 20px;
        background-color: white;
    }
    .itemdetails{
        display: flex;
        justify-content: flex-start;
        flex-direction: column;
        gap: 10px;
        padding: 10px;
    }
    .quantity button{
        padding: 10px;
        border-radius: 8px;
        background-color: white;
        margin-top: 30px;
        border: 1px solid black;
        font: 700;
        font-family: bold;
        font-size: 18px;
    }
    .rightdiv{
        display: flex;
        align-items: stretch;
        justify-content:center;
        flex-direction: column;
        gap: 20px;
        margin-top:20px;
        margin-right:20px;
        width:300px;
        border: 1px solid black;
        padding: 50px;
        border-radius: 20px;
    }  
    .checkout{
        padding: 20px;
        border-radius: 20px;
        background: #014c00;
        color: white;
        font-weight: 800;
        font-size:18px;
    }
    @media (max-width:786px){
.outerdiv{
    flex-direction: column;
    align-items: center;
    gap:0;
}
.rightdiv{
    margin: 20px;
}
.cartitem{
    align-items: center;
}
.cartitem img{
    width: 100px;
    height: auto;
}
    }
    </style>
</head>
<body>
    <h1>Your Cart</h1>
    <h3>Check items in your cart before checkout</h3>
    <div class="outerdiv">
    <div class="leftdiv">
      <div class="cartitem">
        <img src="https://cdn.jiostore.online/v2/jmd-asp/jdprod/wrkr/products/pictures/item/free/original/apple/493839310/0/dmi_m4xb5F-dggahUxfcM-Apple-iPhone-15-128GB-Pink-493839310-i-1-1200Wx1200H.jpeg" alt="product" width="200" height="200">
        <div class="itemdetails">
            <h2>Apple iPhone 15</h2>
            <h4>Price: $999.99</h4>
            <div class="quantity">
            <button type="button">-</button>
            <span>1</span>
            <button type="button">+</button>
            </div>
            </div>
            
      </div>
      <div class="cartitem">
        <img src="https://cdn.jiostore.online/v2/jmd-asp/jdprod/wrkr/products/pictures/item/free/original/apple/493839310/0/dmi_m4xb5F-dggahUxfcM-Apple-iPhone-15-128GB-Pink-493839310-i-1-1200Wx1200H.jpeg" alt="product" width="200" height="200">
        <div class="itemdetails">
            <h2>Apple iPhone 16</h2>
            <h4>Price: $1139.99</h4>
            <div class="quantity">
            <button type="button">-</button>
            <span>1</span>
            <button type="button">+</button>
            </div>
            </div>
            
      </div>
    </div>
    <div class="rightdiv">
       <h2>Secure Checkout</h2>
       <h3>Sub-Total: $2139.98</h3>
       <h3>Tax: $171.20</h3>
       <h3>Shipping: $171.20</h3>
       <h2>Total: $2511.18</h2>
       <button class="checkout">Checkout</button>
    </div>
    </div>
</body>
</html>
