<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Image Gallery Modal (Wide Format)</title>

    <!-- Bootstrap 5.3.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!--
    =================================================================
    OPTIONAL: ENHANCED SKIN
    =================================================================
    -->
    <style>
        /* --- Enhanced Skin --- */
        body {
            background-color: #f8f9fa;
        }

        .gallery-item {
            display: block;
            overflow: hidden;
            border-radius: 0.75rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .gallery-item img {
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }
        
        /*
        =================================================================
        CORE FIX: FORCING WIDESCREEN ASPECT RATIO
        - `aspect-ratio: 16 / 9;` makes the image container wide and short.
        - `object-fit: cover;` ensures the image fills this space
          without being stretched or distorted.
        =================================================================
        */
        .gallery-item img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        /* Modal Customizations */
        .modal.enhanced .modal-content {
            border-radius: 0.75rem;
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .modal.enhanced .modal-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }

        .modal.enhanced .modal-title {
            font-weight: 600;
            color: #343a40;
        }

        .modal.enhanced .modal-body {
            background-color: #ffffff;
            padding: 1.5rem;
        }

        .modal.enhanced .modal-body img {
            border-radius: 0.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .modal.enhanced .modal-footer {
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
            display: flex;
            justify-content: flex-end;
        }
        
        .modal.enhanced .btn {
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .modal.enhanced .btn:hover {
            transform: translateY(-2px);
        }

        .modal-backdrop.show {
            backdrop-filter: blur(3px);
            background-color: rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <!-- 1. IMAGE GALLERY CONTAINER -->
    <div class="container my-5">
        <h1 class="text-center mb-4">Image Gallery</h1>
        <p class="text-center text-muted mb-5">Click on any image to open the action modal.</p>
        
        <div class="row g-4">
            <!-- Gallery Image 1 -->
            <div class="col-lg-4 col-md-6">
                <a href="#" class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1470" class="img-fluid" alt="Panoramic Mountain Landscape" loading="lazy">
                </a>
            </div>
            <!-- Gallery Image 2 -->
            <div class="col-lg-4 col-md-6">
                <a href="#" class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1473448912268-2022ce9509d8?q=80&w=1441" class="img-fluid" alt="Coastal Road with Ocean View" loading="lazy">
                </a>
            </div>
            <!-- Gallery Image 3 -->
            <div class="col-lg-4 col-md-6">
                <a href="#" class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1505144808419-1957a94ca61e?q=80&w=1526" class="img-fluid" alt="Sunset Over a Beach" loading="lazy">
                </a>
            </div>
             <!-- Gallery Image 4 -->
            <div class="col-lg-4 col-md-6">
                <a href="#" class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=1470" class="img-fluid" alt="Lakeside Cabin in the Alps" loading="lazy">
                </a>
            </div>
            <!-- Gallery Image 5 -->
            <div class="col-lg-4 col-md-6">
                <a href="#" class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?q=80&w=1470" class="img-fluid" alt="Sunlight Through a Forest Canopy" loading="lazy">
                </a>
            </div>
            <!-- Gallery Image 6 -->
            <div class="col-lg-4 col-md-6">
                <a href="#" class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1490730141103-6cac27aaab94?q=80&w=1470" class="img-fluid" alt="Lavender Fields in Provence" loading="lazy">
                </a>
            </div>
        </div>
    </div>


    <!-- 2. BOOTSTRAP 5 MODAL MARKUP -->
    <div class="modal fade enhanced" id="imageActionModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-modal="true" role="dialog">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="imageModalLabel">Image Details</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center">
            <img src="" class="img-fluid" alt="Image preview" style="max-height: 75vh;">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-danger" id="deleteButton"><i class="bi bi-trash me-2"></i>Delete</button>
            <button type="button" class="btn btn-secondary" id="editButton"><i class="bi bi-pencil-square me-2"></i>Edit</button>
            <button type="button" class="btn btn-primary" id="orderPrintButton"><i class="bi bi-printer me-2"></i>Order a Print</button>
          </div>
        </div>
      </div>
    </div>


    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- 3. VANILLA JAVASCRIPT FOR DYNAMIC MODAL -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const imageModalEl = document.getElementById('imageActionModal');
        
        if (imageModalEl) {
          const imageModal = new bootstrap.Modal(imageModalEl);
          const modalImage = document.querySelector('#imageActionModal .modal-body img');
          const modalTitle = document.getElementById('imageModalLabel');
          
          const orderPrintButton = document.getElementById('orderPrintButton');
          const editButton = document.getElementById('editButton');
          const deleteButton = document.getElementById('deleteButton');

          // --- Setup Modal Triggers from Gallery ---
          const galleryItems = document.querySelectorAll('.gallery-item');
          galleryItems.forEach(item => {
            item.addEventListener('click', function (event) {
              event.preventDefault(); 
              
              const clickedImage = this.querySelector('img');
              const imgSrc = clickedImage.getAttribute('src');
              const imgAlt = clickedImage.getAttribute('alt');
              
              modalImage.src = imgSrc;
              modalImage.alt = imgAlt;
              modalTitle.textContent = imgAlt || 'Image Details';

              imageModal.show();
            });
          });

          // --- Action 1: Order a Print ---
          orderPrintButton.addEventListener('click', () => {
            alert('Redirecting to the print order page for: ' + modalImage.alt);
            console.log('Order Print for:', modalImage.src);
          });

          // --- Action 2: Edit ---
          editButton.addEventListener('click', () => {
            alert('Redirecting to the editor for: ' + modalImage.alt);
            console.log('Edit:', modalImage.src);
          });

          // --- Action 3: Delete ---
          deleteButton.addEventListener('click', () => {
            if (confirm(`Are you sure you want to delete "${modalImage.alt}"? This action cannot be undone.`)) {
              console.log('User confirmed deletion for:', modalImage.src);
              setTimeout(() => {
                alert(`Image "${modalImage.alt}" successfully deleted.`);
                imageModal.hide();
              }, 500);
            } else {
              console.log('User canceled deletion.');
            }
          });
        }
      });
    </script>

</body>
</html>
