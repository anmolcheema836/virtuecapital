<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Wichtig für Mobile-Optimierung: Verhindert automatisches Zoomen bei Klicks -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeiterfassung | Media AV</title>
    
    <!-- Tailwind CSS (für modernes, schnelles Design ohne extra CSS Datei) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Verhindert Textmarkierung beim schnellen Tippen auf dem Smartphone */
        body {
            -webkit-user-select: none;
            user-select: none;
            background-color: #f3f4f6; /* Leichtes Grau */
        }
    </style>
</head>
<body class="flex justify-center min-h-screen p-4">

    <!-- Haupt-Container (Mobile optimiert, max Breite) -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col mt-4 mb-8">
        
        <!-- Header -->
        <div class="bg-blue-900 text-white p-6 text-center">
            <h1 class="text-2xl font-bold tracking-wide">Zeiterfassung</h1>
            <p class="text-blue-200 text-sm mt-1">time.mediaav.eu</p>
        </div>

        <div class="p-6 flex-1 flex flex-col gap-6">
            
            <!-- 1. Mitarbeiter-Erfassung -->
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Mitarbeiter</label>
                <input type="text" id="empName" placeholder="Vor- und Nachname" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none transition text-lg mb-4" oninput="saveName()">
                
                <label class="block text-sm font-semibold text-gray-700 mb-2">Datum</label>
                <input type="text" id="currentDate" readonly 
                    class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-gray-100 text-gray-600 text-lg cursor-not-allowed">
            </div>

            <!-- 2. Timestamp Funktionen (Buttons) -->
            <div class="flex flex-col gap-3">
                <h2 class="text-sm font-semibold text-gray-700 border-b pb-2 mb-1">Zeitstempel setzen</h2>
                
                <button id="btn_fahrtbeginn" onclick="recordTime('fahrtbeginn', this)" class="w-full py-4 px-5 bg-blue-600 active:bg-blue-800 text-white rounded-xl text-lg font-semibold shadow-md transition-all flex justify-between items-center">
                    <span>🚗 Fahrtbeginn</span>
                    <span class="time-display text-sm font-normal bg-blue-700 px-3 py-1 rounded-full">Klicken</span>
                </button>

                <button id="btn_ankunft" onclick="recordTime('ankunft', this)" class="w-full py-4 px-5 bg-blue-600 active:bg-blue-800 text-white rounded-xl text-lg font-semibold shadow-md transition-all flex justify-between items-center">
                    <span>📍 Ankunft Baustelle</span>
                    <span class="time-display text-sm font-normal bg-blue-700 px-3 py-1 rounded-full">Klicken</span>
                </button>

                <button id="btn_arbeitsbeginn" onclick="recordTime('arbeitsbeginn', this)" class="w-full py-4 px-5 bg-blue-600 active:bg-blue-800 text-white rounded-xl text-lg font-semibold shadow-md transition-all flex justify-between items-center">
                    <span>🛠️ Arbeitsbeginn</span>
                    <span class="time-display text-sm font-normal bg-blue-700 px-3 py-1 rounded-full">Klicken</span>
                </button>

                <div class="grid grid-cols-2 gap-3 mt-2 mb-2">
                    <button id="btn_pausenbeginn" onclick="recordTime('pausenbeginn', this)" class="py-3 px-3 bg-yellow-500 active:bg-yellow-600 text-white rounded-xl font-semibold shadow-md transition-all flex flex-col items-center gap-1">
                        <span>☕ Pause Start</span>
                        <span class="time-display text-xs bg-yellow-600 px-2 py-1 rounded-full">Klicken</span>
                    </button>
                    <button id="btn_pausenende" onclick="recordTime('pausenende', this)" class="py-3 px-3 bg-yellow-500 active:bg-yellow-600 text-white rounded-xl font-semibold shadow-md transition-all flex flex-col items-center gap-1">
                        <span>▶️ Pause Ende</span>
                        <span class="time-display text-xs bg-yellow-600 px-2 py-1 rounded-full">Klicken</span>
                    </button>
                </div>

                <button id="btn_feierabend" onclick="recordTime('feierabend', this)" class="w-full py-4 px-5 bg-blue-600 active:bg-blue-800 text-white rounded-xl text-lg font-semibold shadow-md transition-all flex justify-between items-center">
                    <span>🏠 Feierabend</span>
                    <span class="time-display text-sm font-normal bg-blue-700 px-3 py-1 rounded-full">Klicken</span>
                </button>
            </div>

            <!-- 3. Formular Absenden -->
            <div class="mt-4 pt-6 border-t border-gray-200">
                <button onclick="submitData()" class="w-full py-4 px-5 bg-red-600 active:bg-red-800 text-white rounded-xl text-xl font-bold shadow-lg transition-all flex justify-center items-center gap-2">
                    <span>📤 Tagesbericht absenden</span>
                </button>
            </div>

        </div>
    </div>

    <!-- JavaScript Logik -->
    <script>
        // Heutiges Datum formatieren (DD.MM.YYYY)
        const today = new Date();
        const dateString = today.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        document.getElementById('currentDate').value = dateString;

        // Speicher-Objekt initialisieren (verhindert Datenverlust bei App-Neustart)
        let dailyData = JSON.parse(localStorage.getItem('timeTracker_' + dateString)) || {};

        // Namen aus Speicher laden, falls vorhanden
        const savedName = localStorage.getItem('empName');
        if (savedName) {
            document.getElementById('empName').value = savedName;
        }

        // Namen bei Eingabe speichern
        function saveName() {
            localStorage.setItem('empName', document.getElementById('empName').value);
        }

        // UI basierend auf gespeicherten Daten aktualisieren (falls Seite neu geladen wird)
        function restoreButtons() {
            for (const [action, time] of Object.entries(dailyData)) {
                let btn = document.getElementById('btn_' + action);
                if (btn) {
                    lockButton(btn, time);
                }
            }
        }

        // Button-Design auf "Erledigt" (Grün) setzen
        function lockButton(btn, timeString) {
            btn.classList.remove('bg-blue-600', 'active:bg-blue-800', 'bg-yellow-500', 'active:bg-yellow-600');
            btn.classList.add('bg-green-500', 'cursor-not-allowed');
            
            let timeDisplay = btn.querySelector('.time-display');
            timeDisplay.classList.remove('bg-blue-700', 'bg-yellow-600');
            timeDisplay.classList.add('bg-green-600');
            timeDisplay.innerHTML = '✓ ' + timeString + ' Uhr';
            
            btn.disabled = true;
        }

        // Zeitstempel setzen
        function recordTime(action, btnElement) {
            let now = new Date();
            let timeString = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute:'2-digit' });
            
            // In lokales Objekt und LocalStorage speichern
            dailyData[action] = timeString;
            localStorage.setItem('timeTracker_' + dateString, JSON.stringify(dailyData));
            
            // UI aktualisieren
            lockButton(btnElement, timeString);
        }

        // Daten absenden
        function submitData() {
            let empName = document.getElementById('empName').value.trim();
            
            if (!empName) {
                alert("Bitte gib deinen Namen ein, bevor du den Bericht absendest.");
                document.getElementById('empName').focus();
                return;
            }

            if (Object.keys(dailyData).length === 0) {
                alert("Du hast noch keine Zeiten erfasst!");
                return;
            }

            // Finale Daten zusammenstellen
            let payload = {
                name: empName,
                datum: dateString,
                zeiten: dailyData
            };

            // HIER WÜRDE DER PHP-AUFRUF STATTFINDEN (AJAX / Fetch)
            console.log("Sende Daten:", payload);
            
            /* Beispiel für die Anbindung an process.php:
            fetch('process.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                // ... success handling
            });
            */

            // Simulation für den Nutzer
            alert("Vielen Dank, " + empName + "!\nDeine Zeiten für heute (" + dateString + ") wurden erfolgreich übermittelt.");
            
            // Speicher leeren für den nächsten Tag (Name bleibt gespeichert)
            localStorage.removeItem('timeTracker_' + dateString);
            
            // Seite neu laden
            location.reload();
        }

        // Beim Laden der Seite UI wiederherstellen
        restoreButtons();
    </script>
</body>
</html>
