<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Boat Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    .viewer-container {
      width: 90%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 15px;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    model-viewer {
      width: 100%;
      height: 500px;
      border-radius: 15px;
      background: #dcdcdc; /* Light grey background */
    }

    .controls {
      margin-top: 15px;
    }

    button {
      background: #00c6ff;
      background: linear-gradient(45deg, #0072ff, #00c6ff);
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 30px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      background: linear-gradient(45deg, #00c6ff, #0072ff);
    }
  </style>
</head>
<body>
  <div class="viewer-container">
    <h1>🚤 3D Boat Preview</h1>
    <model-viewer id="boatViewer"
                  src="boat.glb"
                  alt="3D Boat"
                  auto-rotate
                  camera-controls
                  shadow-intensity="1"
                  exposure="1.2"
                  environment-image="neutral">
    </model-viewer>
    <div class="controls">
      <button onclick="document.getElementById('boatViewer').toggleAttribute('auto-rotate')">Toggle Rotate</button>
      <button onclick="document.getElementById('boatViewer').reset()">Reset View</button>
    </div>
  </div>
</body>
</html>
