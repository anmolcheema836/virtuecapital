<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Boat Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    /* Resets and Basic Styles */
    :root {
      --primary-gradient: linear-gradient(45deg, #0072ff, #00c6ff);
      --primary-gradient-hover: linear-gradient(45deg, #00c6ff, #0072ff);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Main Container with Frosted Glass Effect */
    .viewer-container {
      width: 100%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      padding: 25px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.8rem;
      letter-spacing: 1px;
      font-weight: 600;
    }

    /* 3D Model Viewer */
    model-viewer {
      width: 100%;
      height: 400px;
      border-radius: 15px;
      background: #f0f0f0; /* A slightly softer background */
    }

    /* Controls Section */
    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap; /* Allows buttons to wrap on smaller screens */
    }

    button {
      background: var(--primary-gradient);
      border: none;
      padding: 12px 25px;
      border-radius: 30px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s, background 0.3s;
      font-size: 1rem;
    }

    button:hover {
      transform: scale(1.05);
      background: var(--primary-gradient-hover);
    }

    /* Media Queries for Responsiveness */
    @media (min-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }

      model-viewer {
        height: 500px;
      }
    }

    @media (min-width: 900px) {
      .viewer-container {
        padding: 40px;
      }

      h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="viewer-container">
    <h1>🚤 3D Boat Preview</h1>
    <model-viewer id="boatViewer"
                  src="boat.glb"
                  alt="A 3D model of a boat"
                  auto-rotate
                  camera-controls
                  shadow-intensity="1"
                  exposure="1.2"
                  environment-image="neutral"
                  interaction-prompt="auto">
    </model-viewer>
    <div class="controls">
      <button onclick="document.getElementById('boatViewer').toggleAttribute('auto-rotate')">Toggle Rotation</button>
      <button onclick="document.getElementById('boatViewer').cameraOrbit = '0deg 75deg 105%'">Reset View</button>
    </div>
  </div>
</body>
</html>
